name: Deploy to GitHub Pages

# Kein Push-Trigger: die Seite zeigt nur Releases. Der Release-Workflow ruft diesen hier nach dem Anlegen eines
# Releases auf. Manuell neu deployen (z. B. nach einem fehlgeschlagenen Deploy): Actions-Tab, „Run workflow“,
# Tag eintragen, z. B. v0.2.0.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit-SHA oder Tag, der gebaut und deployt wird
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Tag oder Commit-SHA, z. B. v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact_name.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Artefaktnamen setzen
        id: artifact_name
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist
          name: ${{ steps.artifact_name.outputs.name }}

  deploy:
    timeout-minutes: 10
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
